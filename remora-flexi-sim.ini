# =========================================================================
# CONFIGURATION LINUXCNC - PRINTNC (ATELIER DU VERDIER)
# Carte Contrôleur : Flexi-HAL (Firmware Remora)
# Dernière mise à jour : Juin 2026
# =========================================================================
# NOTES :
# [KINS]      : JOINTS = 4 (X, Y1, Z, Y2). Y en tandem (2 moteurs).
# [HOMING]    : Z monte en premier (séquence 0), puis Y et X ensemble (séquence -1).
# [TOOLCHANGE]: Script manuel toolchange.ngc via REMAP M6.
#               #1001 = 0 -> Z zéro sur martyre (auto)
#               #1001 = 1 -> Z zéro sur dessus pièce (manuel)
#               Bouton Reset Ref dans QtDragon pour nouveau job.
# =========================================================================

[EMC]
MACHINE  = PrintNC Flexi-HAL 6000 (SIMULATION)
DEBUG    = 0
VERSION  = 1.1

# =========================================================================
[DISPLAY]
# Taille du cone qui figure l'outil dans la vue de parcours. Le defaut de
# LinuxCNC est 0.5 ; a cette taille il masque la trajectoire des qu'on
# zoome, et c'est justement quand on zoome qu'on veut la voir. 0.2, soit
# 2,5 fois plus petit, le rendait trop discret : 0.3 est le compromis
# retenu a l'ecran, reperable sans couvrir le trait.
# Borne par glcanon entre 0.025 et 2 : hors de la, il retombe a 0.5 sans
# rien dire.
CONE_BASESIZE       = 0.3
# =========================================================================
DISPLAY               = qtvcp qtdragon_hd
PREFERENCE_FILE_PATH  = ~/linuxcnc/configs/flexi-hal/qtdragon.pref
EDITOR                = geany

POSITION_OFFSET       = RELATIVE
POSITION_FEEDBACK     = ACTUAL
ARCDIVISION           = 64
GRIDS                 = 10mm 20mm 50mm 100mm

MAX_FEED_OVERRIDE      = 2.0
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 2.0

DEFAULT_SPINDLE_0_SPEED = 6000
MIN_SPINDLE_0_SPEED     = 100
MAX_SPINDLE_0_SPEED     = 24000
MAX_SPINDLE_POWER       = 2400

DEFAULT_LINEAR_VELOCITY  = 50.00
MIN_LINEAR_VELOCITY      = 0
MAX_LINEAR_VELOCITY      = 100
DEFAULT_ANGULAR_VELOCITY = 36.00
MIN_ANGULAR_VELOCITY     = 0
MAX_ANGULAR_VELOCITY     = 45.00

INTRO_GRAPHIC = PrintNC.png
INTRO_TIME    = 5
INCREMENTS    = 100mm 10mm 1mm 0.1mm .01mm

OPENGL_CHECK_LEVEL  = 2
CANVAS_VCP_LWIDTH   = 3

# Dossier principal des fichiers G-code utilisateur
PROGRAM_PREFIX      = ~/linuxcnc/nc_files
# Dossier des sous-programmes et macros (utilisé par NGCGUI)
NGCGUI_SUBFILE_PATH = ~/linuxcnc/ngcgui_lib
NGCGUI_SUBFILE      = slot.ngc
NGCGUI_SUBFILE      = qpocket.ngc

# =========================================================================
[SPINDLE_0]
# =========================================================================
MIN_FORWARD_VELOCITY = 100
MAX_FORWARD_VELOCITY = 24000
INCREMENT            = 100

# =========================================================================
[PROBE]
# Palpeur de longueur d'outil (VersaProbe)
# ATTENTION : TOOLSET_X / TOOLSET_Y ci-dessous ne sont lus PAR PERSONNE
# dans cette configuration -- reste du sous-programme d'exemple
# qt_auto_probe_tool.ngc, remplace par notre REMAP vers toolchange.ngc.
# La position qui fait foi est celle de [VERSA_TOOLSETTER] plus bas :
# c'est elle que lisent l'interface (versa_probe.py) ET les deux
# sous-programmes de palpage. Ces deux lignes-ci sont tenues a jour pour
# qu'elles ne mentent pas, pas parce qu'elles servent.
# =========================================================================
USE_PROBE       = versaprobe
TOOLSET_X       = -50.0
TOOLSET_Y       = 1185.0
TOOLSET_Z_CLEAR = -5.0
TOOLSET_FEED    = 250.0
TOOLSET_SEEK    = 30.0

# =========================================================================
[VERSA_TOOLSETTER]
# Coordonnées machine (G53) du palpeur fixe. SOURCE UNIQUE : lue par
# l'interface et par toolchange.ngc / palper_outil.ngc.
#
# LE BANC EST EN AVANCE SUR LA MACHINE, ET C'EST VOULU. La pastille est
# encore a Y60 dans la vraie config ; ici elle est deja au fond, pour
# repeter le futur emplacement avec le magasin ATC. La divergence est
# donc DITE, et elle prend fin le jour ou la plaque est vissee : ce
# jour-la, reporter 1185 dans remora-flexi.ini -- jamais avant.
#
# Y = 1185 et non 1275 : le nez du laser pend 90 mm en avant de la
# broche, donc un palpage laser amene la broche a Y+90, soit 1275 pour
# 1286 de course. A 1275 la pastille aurait demande 1365 : hors course,
# et rien ne l'aurait rattrape -- le plafond existant ne protege que X.
# =========================================================================
X           = -50.0
Y           = 1185.0
Z           = -10.0
Z_MAX_CLEAR = -3.0
MAXPROBE    = 60.0

# =========================================================================
[MDI_COMMAND_LIST]
# Boutons accessibles depuis l'onglet MAIN de QtDragon
# =========================================================================
# Va au zéro pièce en sécurité (Z d'abord, puis X Y)
MDI_COMMAND = G0 Z25;X0 Y0;Z0, Goto\nUser\nZero
# Retourne à l'origine machine
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y0, Goto\nMachn\nZero
# Remet #1000 et #1002 à zéro avant un nouveau job
MDI_COMMAND = O<reset_ref> call, Reset\nRef
# Sélectionne le mode Z zéro sur le martyre (automatique)
MDI_COMMAND = O<set_mode_martyre> call, Mode\nMartyre
# Sélectionne le mode Z zéro pris manuellement sur la pièce
MDI_COMMAND = O<set_mode_piece> call, Mode\nPiece
# =========================================================================
[KINS]
# =========================================================================
JOINTS     = 4
KINEMATICS = trivkins coordinates=XYZY kinstype=BOTH

# =========================================================================
[FILTER]
# =========================================================================
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code file (*.ngc,*.nc,*.tap)
PROGRAM_EXTENSION = .py Python Script
py = python

# =========================================================================
[TASK]
# =========================================================================
TASK       = milltask
CYCLE_TIME = 0.010

# =========================================================================
[RS274NGC]
# =========================================================================
PARAMETER_FILE        = linuxcnc.var
RS274NGC_STARTUP_CODE = F10 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
FEATURES              = 12

# Changement d'outil via script manuel -- ACTIF en simulation depuis le
# 17/08/2026. Il etait desactive, et c'est precisement ce qui empechait le
# banc d'eprouver toolchange.ngc : M6 y appelait le changement INTEGRE de
# LinuxCNC, pas le sous-programme de l'atelier. On croyait tester le
# changeur, on testait autre chose. Il lui faut le palpeur simule du .hal,
# sans quoi le G38.2 va au bout de sa course et echoue.
REMAP=M6 modalgroup=6 ngc=toolchange

# Chemins des sous-programmes et macros.
#
# Meme liste que la config machine, et pour la meme raison : le depot est clone
# a ~/linuxcnc/configs/flexi-hal sur le PC de la machine et a
# ~/Projets/machine/printnc-config sur le poste de conception. Un chemin introuvable
# est saute sans trou dans la liste ni message.
# Le dossier `banc/` vient EN PREMIER, et seulement ici : il porte un
# atc_config.ngc de meme nom que le vrai, avec des valeurs provisoires,
# pour repeter la sequence du magasin avant qu'il existe. La resolution
# par ordre de chemin suffit -- rien a marquer dans les appels, et la
# machine, dont l'ini ne cite pas ce dossier, ne peut pas y tomber.
SUBROUTINE_PATH = ~/Projets/machine/printnc-config/subroutines/banc:~/linuxcnc/configs/flexi-hal/subroutines:~/Projets/machine/printnc-config/subroutines:~/linuxcnc/ngcgui_lib:~/linuxcnc/ngcgui_lib/utilitysubs

# Routine de sécurité sur arrêt d'urgence (DESACTIVEE EN SIMULATION)
#ON_ABORT_COMMAND = O<on_abort> call

# =========================================================================
[EMCMOT]
# =========================================================================
EMCMOT       = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT    = 0.010
BASE_PERIOD  = 0
SERVO_PERIOD = 1000000
NUM_DIO = 4

# =========================================================================
[HAL]
# =========================================================================
TWOPASS         = on
HALFILE         = remora-flexi-sim.hal
POSTGUI_HALFILE = postgui_call_list_sim.hal
HALUI           = halui

# =========================================================================
[TRAJ]
# =========================================================================
COORDINATES             = XYZY
LINEAR_UNITS            = mm
ANGULAR_UNITS           = degree
CYCLE_TIME              = 0.010
DEFAULT_LINEAR_VELOCITY = 50.00
MAX_LINEAR_VELOCITY     = 100
SPINDLES                = 1

# =========================================================================
[EMCIO]
# =========================================================================
EMCIO      = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# =========================================================================
# AXE X
# =========================================================================
[AXIS_X]
MAX_VELOCITY     = 100
MAX_ACCELERATION = 200
MIN_LIMIT        = -50.0
MAX_LIMIT        = 1240.0

[JOINT_0]
TYPE             = LINEAR
HOME             = -50.0
MIN_LIMIT        = -50.0
MAX_LIMIT        = 1240.0
# 1600 pas/tour, vis SFU1610 pas 10mm. Négatif = sens inversé
SCALE            = -160.0
MAX_VELOCITY     = 100
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 86
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = -50
# Négatif = part vers la gauche pour chercher le capteur
HOME_SEARCH_VEL  = 0
HOME_LATCH_VEL   = 0
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Homing en même temps que Y, après Z
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Y (Moteur 1 du portique)
# =========================================================================
[AXIS_Y]
MAX_VELOCITY     = 100
MAX_ACCELERATION = 200.0
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00

[JOINT_1]
TYPE             = LINEAR
HOME             = 1275
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00
# 1600 pas/tour, vis SFU1610 pas 10mm
SCALE            = 160.0
MAX_VELOCITY     = 100
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 86
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1285
# Positif = avance vers le fond pour chercher le capteur
HOME_SEARCH_VEL  = 0
HOME_LATCH_VEL   = 0
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Homing en même temps que X et Y2, après Z
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Y2 (Moteur 2 du portique - esclave tandem de JOINT_1)
# =========================================================================
[JOINT_3]
TYPE             = LINEAR
HOME             = 1275
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00
# Négatif car moteur monté en miroir
SCALE            = -160.0
MAX_VELOCITY     = 100
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 86
STEPGEN_MAXACCEL = 250.0
# Timings plus larges pour ce moteur
STEPLEN          = 5000
STEPSPACE        = 5000
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1285
HOME_SEARCH_VEL  = 0
HOME_LATCH_VEL   = 0
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Identique à JOINT_1 pour synchronisation parfaite du portique
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Z
# =========================================================================
[AXIS_Z]
MAX_VELOCITY     = 45.0
MAX_ACCELERATION = 180.0
MIN_LIMIT        = -140
MAX_LIMIT        = 5

[JOINT_2]
TYPE             = LINEAR
HOME             = 0.0
# Recopie de remora-flexi.ini, et ce n'est pas cosmetique : une sim plus
# PERMISSIVE que la machine laisse passer un programme que la vraie
# refusera en limite logicielle -- justement ce qu'on lui demande de
# detecter. Toute course qui bouge la-bas doit bouger ici.
MIN_LIMIT        = -140
MAX_LIMIT        = 5
# 1600 pas/tour, vis SFU1204 pas 4mm
SCALE            = 400
# 45 mm/s = 2700 mm/min (675 tr/min sur la SFU1204). Monte depuis 33,33
# le 03/08/2026 pour le tramage « fuseau » du laser (la longueur mini
# d'un fuseau est inversement proportionnelle a cette vitesse), puis
# redescendu de 50 a 45 le 09/08/2026 parce que LA VIS GROGNE a 750
# tr/min. Le raisonnement complet est dans remora-flexi.ini, [JOINT_2] :
# c'est lui la reference, la sim recopie.
# STEPGEN_MAXVEL reste a 100, soit 2x la consigne : large.
MAX_VELOCITY     = 45.0
MAX_ACCELERATION = 180.0
STEPGEN_MAXVEL   = 100.0
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
# Gain doux pour éviter les résonances verticales
P_GAIN           = 8
FF1_GAIN         = 1.0
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1.0
# Positif = monte pour chercher le capteur (sécurité outil)
HOME_SEARCH_VEL  = 0
HOME_LATCH_VEL   = 0
HOME_FINAL_VEL   = 8.0
HOME_USE_INDEX   = NO
# Z monte EN PREMIER, impératif pour la sécurité de l'outil
HOME_SEQUENCE    = 0
