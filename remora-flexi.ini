# =========================================================================
# CONFIGURATION LINUXCNC - PRINTNC (ATELIER DU VERDIER)
# Carte Contrôleur : Flexi-HAL (Firmware Remora)
# Dernière mise à jour : Juin 2026
# =========================================================================
# NOTES :
# [KINS]      : JOINTS = 4 (X, Y1, Z, Y2). Y en tandem (2 moteurs).
# [HOMING]    : Z monte en premier (séquence 0), puis Y et X ensemble (séquence -1).
# [TOOLCHANGE]: Script manuel toolchange.ngc via REMAP M6.
#               #1001 = 0 -> Z zéro sur martyre (auto)
#               #1001 = 1 -> Z zéro sur dessus pièce (manuel)
#               Bouton Reset Ref dans QtDragon pour nouveau job.
# =========================================================================

[EMC]
MACHINE  = PrintNC Flexi-HAL 6000
DEBUG    = 0
VERSION  = 1.1

# =========================================================================
[DISPLAY]
# =========================================================================
DISPLAY               = qtvcp -f qtdragon_hd
PREFERENCE_FILE_PATH  = ~/linuxcnc/configs/flexi-hal/qtdragon.pref
EDITOR                = geany

POSITION_OFFSET       = RELATIVE
POSITION_FEEDBACK     = ACTUAL
ARCDIVISION           = 64
GRIDS                 = 10mm 20mm 50mm 100mm

MAX_FEED_OVERRIDE      = 2.0
MIN_SPINDLE_0_OVERRIDE = 0.5
MAX_SPINDLE_0_OVERRIDE = 2.0

DEFAULT_SPINDLE_0_SPEED = 6000
MIN_SPINDLE_0_SPEED     = 100
MAX_SPINDLE_0_SPEED     = 24000
MAX_SPINDLE_POWER       = 2400

DEFAULT_LINEAR_VELOCITY  = 50.00
MIN_LINEAR_VELOCITY      = 0
MAX_LINEAR_VELOCITY      = 133.33
DEFAULT_ANGULAR_VELOCITY = 36.00
MIN_ANGULAR_VELOCITY     = 0
MAX_ANGULAR_VELOCITY     = 45.00

INTRO_GRAPHIC = /home/expatria/linuxcnc/configs/flexi-hal/PrintNC.png
INTRO_TIME    = 5
INCREMENTS    = 100mm 10mm 1mm 0.1mm .01mm

OPENGL_CHECK_LEVEL  = 2
CANVAS_VCP_LWIDTH   = 3

# Dossier principal des fichiers G-code utilisateur
PROGRAM_PREFIX      = ~/linuxcnc/nc_files
# Dossier des sous-programmes et macros (utilisé par NGCGUI)
NGCGUI_SUBFILE_PATH = ~/linuxcnc/ngcgui_lib
NGCGUI_SUBFILE      = slot.ngc
NGCGUI_SUBFILE      = qpocket.ngc

# =========================================================================
[SPINDLE_0]
# =========================================================================
MIN_FORWARD_VELOCITY = 100
MAX_FORWARD_VELOCITY = 24000
INCREMENT            = 100

# =========================================================================
[PROBE]
# Palpeur de longueur d'outil (VersaProbe)
# =========================================================================
USE_PROBE       = versaprobe
TOOLSET_X       = -50.0
TOOLSET_Y       = 60.0
TOOLSET_Z_CLEAR = -5.0
TOOLSET_FEED    = 250.0
TOOLSET_SEEK    = 30.0

# =========================================================================
[VERSA_TOOLSETTER]
# Coordonnées machine (G53) du palpeur fixe
# =========================================================================
X           = -50.0
Y           = 60.0
Z           = -10.0
Z_MAX_CLEAR = -3.0
MAXPROBE    = 60.0

# =========================================================================
[MDI_COMMAND_LIST]
# Boutons accessibles depuis l'onglet MAIN de QtDragon
# =========================================================================
# Va au zéro pièce en sécurité (Z d'abord, puis X Y)
MDI_COMMAND = G0 Z25;X0 Y0;Z0, Goto\nUser\nZero
# Retourne à l'origine machine
MDI_COMMAND = G53 G0 Z0;G53 G0 X0 Y0, Goto\nMachn\nZero
# Remet #1000 et #1002 à zéro avant un nouveau job
MDI_COMMAND = O<reset_ref> call, Reset\nRef
# Sélectionne le mode Z zéro sur le martyre (automatique)
MDI_COMMAND = O<set_mode_martyre> call, Mode\nMartyre
# Sélectionne le mode Z zéro pris manuellement sur la pièce
MDI_COMMAND = O<set_mode_piece> call, Mode\nPiece
# =========================================================================
[KINS]
# =========================================================================
JOINTS     = 4
KINEMATICS = trivkins coordinates=XYZY kinstype=BOTH

# =========================================================================
[FILTER]
# =========================================================================
PROGRAM_EXTENSION = .ngc,.nc,.tap G-Code file (*.ngc,*.nc,*.tap)
PROGRAM_EXTENSION = .py Python Script
py = python

# =========================================================================
[TASK]
# =========================================================================
TASK       = milltask
CYCLE_TIME = 0.010

# =========================================================================
[RS274NGC]
# =========================================================================
PARAMETER_FILE        = linuxcnc.var
RS274NGC_STARTUP_CODE = F10 G21 G17 G40 G49 G54 G64 P0.001 G80 G90 G91.1 G92.1 G94 G97 G98
FEATURES              = 12

# Changement d'outil via script manuel
REMAP=M6 modalgroup=6 ngc=toolchange

# Chemins des sous-programmes et macros
SUBROUTINE_PATH = ~/linuxcnc/configs/flexi-hal/subroutines:~/linuxcnc/ngcgui_lib:~/linuxcnc/ngcgui_lib/utilitysubs

# Routine de sécurité sur arrêt d'urgence
ON_ABORT_COMMAND = O<on_abort> call

# =========================================================================
[EMCMOT]
# =========================================================================
EMCMOT       = motmod
COMM_TIMEOUT = 1.0
COMM_WAIT    = 0.010
BASE_PERIOD  = 0
SERVO_PERIOD = 1000000
NUM_DIO = 4

# =========================================================================
[HAL]
# =========================================================================
TWOPASS         = on
HALFILE         = remora-flexi.hal
POSTGUI_HALFILE = postgui_call_list.hal
HALUI           = halui

# =========================================================================
[TRAJ]
# =========================================================================
COORDINATES             = XYZY
LINEAR_UNITS            = mm
ANGULAR_UNITS           = degree
CYCLE_TIME              = 0.010
DEFAULT_LINEAR_VELOCITY = 50.00
MAX_LINEAR_VELOCITY     = 133.33
SPINDLES                = 1

# =========================================================================
[EMCIO]
# ===========================FEATURE
==============================================
EMCIO      = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

# =========================================================================
# AXE X
# =========================================================================
[AXIS_X]
MAX_VELOCITY     = 133.33
MAX_ACCELERATION = 200
MIN_LIMIT        = -50.0
MAX_LIMIT        = 1240.0

[JOINT_0]
TYPE             = LINEAR
HOME             = -50.0
MIN_LIMIT        = -50.0
MAX_LIMIT        = 1240.0
# 1600 pas/tour, vis SFU1610 pas 10mm. Négatif = sens inversé
SCALE            = -160.0
MAX_VELOCITY     = 133.33
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 160
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = -50
# Négatif = part vers la gauche pour chercher le capteur
HOME_SEARCH_VEL  = -20
HOME_LATCH_VEL   = 2
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Homing en même temps que Y, après Z
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Y (Moteur 1 du portique)
# =========================================================================
[AXIS_Y]
MAX_VELOCITY     = 133.33
MAX_ACCELERATION = 200.0
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00

[JOINT_1]
TYPE             = LINEAR
HOME             = 1275
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00
# 1600 pas/tour, vis SFU1610 pas 10mm
SCALE            = 160.0
MAX_VELOCITY     = 133.33
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 160
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1285
# Positif = avance vers le fond pour chercher le capteur
HOME_SEARCH_VEL  = 20
HOME_LATCH_VEL   = -1
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Homing en même temps que X et Y2, après Z
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Y2 (Moteur 2 du portique - esclave tandem de JOINT_1)
# =========================================================================
[JOINT_3]
TYPE             = LINEAR
HOME             = 1275
MIN_LIMIT        = -2.0
MAX_LIMIT        = 1286.00
# Négatif car moteur monté en miroir
SCALE            = -160.0
MAX_VELOCITY     = 133.33
MAX_ACCELERATION = 200.0
STEPGEN_MAXVEL   = 160
STEPGEN_MAXACCEL = 250.0
# Timings identiques aux autres axes (harmonises a 2500)
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
P_GAIN           = 50
FF1_GAIN         = 1
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1285
HOME_SEARCH_VEL  = 20
HOME_LATCH_VEL   = -1
HOME_FINAL_VEL   = 8
HOME_USE_INDEX   = NO
# Identique à JOINT_1 pour synchronisation parfaite du portique
HOME_SEQUENCE    = -1

# =========================================================================
# AXE Z
# =========================================================================
[AXIS_Z]
MAX_VELOCITY     = 33.33
MAX_ACCELERATION = 180.0
MIN_LIMIT        = -185
MAX_LIMIT        = 5

[JOINT_2]
TYPE             = LINEAR
HOME             = 0.0
MIN_LIMIT        = -185
MAX_LIMIT        = 5
# 1600 pas/tour, vis SFU1204 pas 4mm
SCALE            = 400
MAX_VELOCITY     = 33.33
MAX_ACCELERATION = 180.0
STEPGEN_MAXVEL   = 100.0
STEPGEN_MAXACCEL = 250.0
STEPLEN          = 2500
STEPSPACE        = 2500
DIRSETUP         = 4500
DIRHOLD          = 4500
# Gain doux pour éviter les résonances verticales
P_GAIN           = 8
FF1_GAIN         = 1.0
DEADBAND         = 0.005
FERROR           = 5
MIN_FERROR       = 0.5
HOME_OFFSET      = 1.0
# Positif = monte pour chercher le capteur (sécurité outil)
HOME_SEARCH_VEL  = 10
HOME_LATCH_VEL   = -1.5
HOME_FINAL_VEL   = 8.0
HOME_USE_INDEX   = NO
# Z monte EN PREMIER, impératif pour la sécurité de l'outil
HOME_SEQUENCE    = 0
