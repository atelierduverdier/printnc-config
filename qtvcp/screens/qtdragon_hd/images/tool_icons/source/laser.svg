<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Laser">
  <title>Laser</title>
  <!-- Pince commune a tous les dessins : c'est elle qui rend les outils
       comparables entre eux. Grise, toujours : elle n'est pas l'outil. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="46" y="68" width="68" height="72" rx="6" fill="#ff9a1f"/>
  <path d="M60 92 h40 M60 110 h40" stroke="#14171b" stroke-width="7"
        opacity="0.4" stroke-linecap="round"/>
  <path d="M64 140 h32 l-6 20 h-20 z" fill="#a8b0bc"/>
  <!-- Le faisceau, qui va se pincer jusqu'au point focal. -->
  <path d="M74 160 l6 52 l6 -52 z" fill="#ff9a1f" opacity="0.9"/>
  <circle cx="80" cy="220" r="7" fill="#ff9a1f"/>
</svg>
