<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Fraise demi-ronde">
  <title>Fraise demi-ronde</title>
  <!-- Pince commune a tous les dessins : c'est elle qui rend les outils
       comparables entre eux. Grise, toujours : elle n'est pas l'outil. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="66" y="68" width="28" height="112" fill="#ff9a1f"/>
  <path d="M66 106 Q80 99 94 92" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M66 136 Q80 129 94 122" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <rect x="70" y="180" width="20" height="14" fill="#ff9a1f"/>
  <circle cx="80" cy="203" r="19" fill="#ff9a1f"/>
  <!-- L'arete qui epouse le rond : elle dit le ROND comme la barre
       horizontale de la fraise droite dit le PLAT. -->
  <path d="M63 196 A19 19 0 0 0 97 196" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
</svg>
