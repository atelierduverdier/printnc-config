  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <path d="M71 68 h18 v138 l-9 22 l-9 -22 z" fill="#ff9a1f"/>
    <path d="M71 92 Q80 87 89 80" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 107 Q80 102 89 95" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 122 Q80 117 89 110" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 137 Q80 132 89 125" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 152 Q80 147 89 140" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 167 Q80 162 89 155" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 182 Q80 177 89 170" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M71 197 Q80 192 89 185" stroke="#14171b" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round"/>
