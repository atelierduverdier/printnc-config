           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="66" y="68" width="28" height="160" fill="#39414d"/>
  <rect x="66" y="68" width="28" height="160" fill="none" stroke="#a8b0bc"
        stroke-width="4" stroke-dasharray="10 9"/>
</svg>
