<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Outil non decrit">
  <title>Outil non decrit</title>
  <!-- Pince et queue, communes a tous les dessins : c'est ce qui rend la
       partie basse comparable d'un outil a l'autre. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v34 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-34 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="46" y="58" width="68" height="12" rx="3" fill="#7c8592"/>
  <rect x="66" y="66" width="28" height="84" fill="#a8b0bc"/>
  <!-- Partie coupante en GRIS et non en orange, contour tirete comme le
       dessin « aucun » : un outil est bien monte, mais rien ne dit ce qu'il
       coupe. Dans ce jeu l'orange est reserve a ce qu'on sait nommer, et
       aucun texte n'est employe — pas de police a dependre. -->
  <rect x="66" y="150" width="28" height="78" fill="#39414d"/>
  <rect x="66" y="150" width="28" height="78" fill="none" stroke="#a8b0bc"
        stroke-width="4" stroke-dasharray="9 8"/>
</svg>
