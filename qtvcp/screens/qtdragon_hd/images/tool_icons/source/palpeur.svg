<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Palpeur">
  <title>Palpeur</title>
  <!-- Pince commune a tous les dessins : c'est elle qui rend les outils
       comparables entre eux. Grise, toujours : elle n'est pas l'outil. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="58" y="68" width="44" height="58" rx="5" fill="#ff9a1f"/>
  <!-- Le ressort : ce qui distingue un palpeur d'un outil coupant. -->
  <path d="M68 128 l24 10 l-24 10 l24 10 l-24 10 l24 10" stroke="#ff9a1f"
        stroke-width="7" fill="none" stroke-linejoin="round"
        stroke-linecap="round"/>
  <rect x="77" y="180" width="6" height="34" fill="#a8b0bc"/>
  <circle cx="80" cy="221" r="12" fill="#a8b0bc"/>
</svg>
