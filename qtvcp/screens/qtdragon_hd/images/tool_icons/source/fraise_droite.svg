<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Fraise droite">
  <title>Fraise droite</title>
  <!-- Pince commune a tous les dessins : c'est elle qui rend les outils
       comparables entre eux. Grise, toujours : elle n'est pas l'outil. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="66" y="68" width="28" height="160" fill="#ff9a1f"/>
    <path d="M66 108 Q80 101 94 92" stroke="#14171b" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M66 134 Q80 127 94 118" stroke="#14171b" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M66 160 Q80 153 94 144" stroke="#14171b" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M66 186 Q80 179 94 170" stroke="#14171b" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M66 212 Q80 205 94 196" stroke="#14171b" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- L'arete de coupe en bout, ce qui signe le fond plat. -->
  <rect x="66" y="220" width="28" height="8" fill="#14171b" opacity="0.55"/>
</svg>
