<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 240"
     width="160" height="240" role="img" aria-label="Fraise droite">
  <title>Fraise droite</title>
  <!-- Pince commune a tous les dessins : c'est elle qui rend les outils
       comparables entre eux. Grise, toujours : elle n'est pas l'outil. -->
  <path d="M28 12 h104 a6 6 0 0 1 6 6 v30 a6 6 0 0 1 -6 6 h-104
           a6 6 0 0 1 -6 -6 v-30 a6 6 0 0 1 6 -6 z" fill="#7c8592"/>
  <rect x="44" y="54" width="72" height="14" rx="3" fill="#7c8592"/>

  <rect x="66" y="68" width="28" height="160" fill="#ff9a1f"/>
  <path d="M66 108 Q80 101 94 94" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M66 136 Q80 129 94 122" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M66 164 Q80 157 94 150" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <path d="M66 192 Q80 185 94 178" stroke="#14171b" stroke-width="8"
        fill="none" opacity="0.5" stroke-linecap="round"/>
  <!-- L'arete de bout : le trait le plus franc du dessin, parce que c'est
       lui qui s'oppose a la bille de la demi-ronde. -->
  <rect x="66" y="214" width="28" height="9" fill="#14171b" opacity="0.6"/>
</svg>
